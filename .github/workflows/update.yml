name: Update Cool Computers

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: update-formula
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate formula from verified public release
        id: formula
        run: |
          python3 scripts/update.py
          if git diff --quiet -- Formula/cool.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and test the candidate formula
        if: steps.formula.outputs.changed == 'true'
        run: |
          brew tap the-money-company-limited/tap "$GITHUB_WORKSPACE"
          cp Formula/cool.rb "$(brew --repository the-money-company-limited/tap)/Formula/cool.rb"
          brew install --build-from-source the-money-company-limited/tap/cool
          brew test the-money-company-limited/tap/cool
      - name: Publish the tested formula
        if: steps.formula.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/cool.rb
          git commit -m "Update Cool Computers formula"
          git push origin HEAD:main
